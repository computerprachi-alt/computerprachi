<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shopping Cart | Computer Prachi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#222;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:900px;margin:auto;background:#fff;min-height:100vh}.head{background:linear-gradient(135deg,#071a55,#123c91);color:#fff;padding:20px;text-align:center}.head h1{margin:0;font-size:27px}.nav{background:#102d69;text-align:center;padding:9px}.nav a{color:#fff;text-decoration:none;font-weight:700;margin:0 8px;font-size:13px}.main{padding:16px}.box{border:1px solid #d8e1ef;border-radius:9px;background:#fff;padding:15px}.item{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.item h3{margin:0;color:#102d69;font-size:15px}.muted{color:#777;font-size:12px;margin-top:3px}.qty{display:flex;align-items:center;gap:7px}.qty button{width:30px;height:30px;border:1px solid #cbd9ec;background:#fff;border-radius:5px;font-weight:800;cursor:pointer}.total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding:15px 0}.checkout{display:block;text-align:center;background:#087c18;color:#fff;text-decoration:none;padding:12px;border-radius:6px;font-weight:800}.clear{margin-top:8px;width:100%;padding:10px;border:1px solid #c40000;background:#fff;color:#c40000;border-radius:6px;font-weight:700;cursor:pointer}.empty{text-align:center;padding:35px;color:#777}
@media(max-width:600px){.item{grid-template-columns:1fr}.qty{justify-content:flex-start}}
</style></head>
<body><div class="wrap"><header class="head"><h1>🛍️ Your Cart</h1><p>Computer Prachi Local Shopping</p></header>
<nav class="nav"><a href="index.html">⌂ Home</a><a href="local-shopping.html">🛒 Shops</a><a href="shopping-cart.html">🛍️ Cart</a></nav>
<main class="main"><div class="box"><div id="items"></div><div id="empty" class="empty">Cart अभी खाली है।<br><br><a href="local-shopping.html">← Shops देखें</a></div><div id="summary" style="display:none"><div class="total"><span>Total</span><span id="total">₹0</span></div><a class="checkout" href="#" onclick="alert('Checkout module अगले चरण में जोड़ा जाएगा।');return false;">Proceed to Checkout →</a><button class="clear" onclick="clearCart()">Clear Cart</button></div></div></main></div>
<script>
function get(){return JSON.parse(localStorage.getItem("cpCart")||"{}")}function save(c){localStorage.setItem("cpCart",JSON.stringify(c));render()}
function change(id,d){let c=get();if(!c[id])return;c[id].qty+=d;if(c[id].qty<=0)delete c[id];save(c)}
function clearCart(){localStorage.removeItem("cpCart");render()}
function render(){let c=get(),keys=Object.keys(c);document.getElementById("empty").style.display=keys.length?"none":"block";document.getElementById("summary").style.display=keys.length?"block":"none";let total=0;document.getElementById("items").innerHTML=keys.map(id=>{let x=c[id],sub=x.price*x.qty;total+=sub;return `<div class="item"><div><h3>${x.name}</h3><div class="muted">${x.shop} • ₹${x.price} each</div></div><div class="qty"><button onclick="change('${x.id}',-1)">−</button><b>${x.qty}</b><button onclick="change('${x.id}',1)">+</button></div><b>₹${sub}</b></div>`}).join("");document.getElementById("total").textContent="₹"+total}render();
</script></body></html>
