name: Document Locker Recovery Checks
on:
  pull_request:
    paths:
      - "supabase/functions/document-locker-recovery/**"
      - "tests/document-locker-recovery-regression.test.mjs"
      - "document-locker-login.html"
      - "document-locker-dashboard.html"
      - "document-locker-recovery.html"
      - "document-locker-recovery-settings.html"
      - "supabase/migrations/*document_locker_account_recovery.sql"
      - ".github/workflows/document-locker-recovery.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check recovery Edge Function and tests
        run: deno check supabase/functions/document-locker-recovery/index.ts supabase/functions/document-locker-recovery/index.test.ts
      - name: Run staging integration tests (safe-skipped unless dedicated staging secrets are configured)
        env:
          RECOVERY_TEST_ALLOW_STAGING: ${{ secrets.RECOVERY_TEST_ALLOW_STAGING }}
          RECOVERY_TEST_BASE_URL: ${{ secrets.RECOVERY_TEST_BASE_URL }}
          RECOVERY_TEST_ANON_KEY: ${{ secrets.RECOVERY_TEST_ANON_KEY }}
          RECOVERY_TEST_USER_ACCESS_TOKEN: ${{ secrets.RECOVERY_TEST_USER_ACCESS_TOKEN }}
          RECOVERY_TEST_NEW_PASSWORD: ${{ secrets.RECOVERY_TEST_NEW_PASSWORD }}
        run: deno test --allow-env --allow-net supabase/functions/document-locker-recovery/index.test.ts
      - name: Run Email OTP and private-document regression tests
        run: node --test tests/document-locker-recovery-regression.test.mjs
