# Computer Prachi category updater fixed: 10-09-2026
name: Computer Prachi Automatic Updates

on:
  schedule:
    # GitHub uses UTC. Runs every 30 minutes.
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: computer-prachi-auto-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install updater dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch and update Jobs / Results / Admit Card + official action links
        run: python auto_update.py

      - name: Commit changed pages
        run: |
          git config user.name "Computer Prachi Auto Update"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new updates found."
          else
            git commit -m "Auto update jobs results admit cards"
            git push
          fi
