<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Us | Computer Prachi</title><style>body{margin:0;background:#f1f3f6;font-family:Arial;color:#222}.wrap{max-width:900px;margin:auto;background:#fff;min-height:100vh;padding:20px}h1{color:#b40000}a{color:#0645d6}</style>
<style id="cp-live-clock-style">
.cp-live-clock{
  position:absolute;right:145px;top:6px;z-index:9999;
  display:flex;align-items:center;gap:5px;
  font:600 11px/1.1 Arial,sans-serif;color:#fff;
  white-space:nowrap;
}
.cp-live-clock .cp-time{
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.24);
  border-radius:13px;padding:4px 8px;
}
.cp-live-clock .cp-date{opacity:.9}
@media(max-width:900px){
  .cp-live-clock{right:118px;font-size:10px}
  .cp-live-clock .cp-date{display:none}
}
@media(max-width:700px){
  .cp-live-clock{right:8px;top:4px}
  .cp-live-clock .cp-date{display:none}
  .cp-live-clock .cp-time{padding:4px 7px}
}
</style>
</head><body><div id="cp-live-clock" class="cp-live-clock"><span class="cp-time">🕐 --:--:-- --</span><span class="cp-date">--</span></div><div class="wrap"><h1>💻 Computer Prachi — Contact Us</h1><p>Computer Prachi<br>Tilkamanjhi, Bhagalpur, Bihar - 812001<br><br>सुझाव, correction या website-related query के लिए कृपया अपना official contact email/WhatsApp यहाँ जोड़ें।<br><br>Note: मोबाइल: <br><br>ईमेल: info@computerprachi.com</p><p><a href="index.html">← Back to Home</a></p></div>

<script id="cp-live-clock-script">
(function(){
  function tick(){
    var now=new Date();
    var time=now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
    var date=now.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
    var el=document.getElementById('cp-live-clock');
    if(!el) return;
    var te=el.querySelector('.cp-time'), de=el.querySelector('.cp-date');
    if(te) te.textContent='🕐 '+time;
    if(de) de.textContent=date;
  }
  tick();
  setInterval(tick,1000);
})();
</script>
</body></html>
