<script id="cp-live-clock-script">
(function(){
  function tick(){
    var now=new Date();
    var t=now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
    var d=now.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
    var el=document.getElementById('cp-live-clock');
    if(el){
      var time=el.querySelector('.cp-time'), date=el.querySelector('.cp-date');
      if(time) time.textContent='🕐 '+t;
      if(date) date.textContent=d;
    }
  }
  tick(); setInterval(tick,1000);
})();
</script>
