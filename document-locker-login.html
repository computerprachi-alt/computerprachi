<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Digital Document Locker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{--navy:#07145c;--red:#c40000;--bg:#f5f7fb;--border:#d8dfeb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial;color:#222}.wrap{max-width:600px;margin:45px auto;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 5px 22px #173b7a12;overflow:hidden}.head{background:var(--navy);color:#fff;text-align:center;padding:24px}.head b{font-size:24px}.form{padding:28px}.field{margin-bottom:16px}.field label{display:block;font-weight:700;margin-bottom:6px;color:#25365f}.field input{width:100%;height:44px;border:1px solid #c9d2e2;border-radius:6px;padding:0 11px}.btn{width:100%;height:45px;border:0;border-radius:6px;background:var(--red);color:#fff;font-weight:700;cursor:pointer}.btn:disabled{opacity:.6}.msg{margin-top:14px;padding:11px;border-radius:6px;background:#f4f7fb;line-height:1.5}.links{text-align:center;margin-top:18px;line-height:1.8}.links a{color:#0019a8}@media(max-width:600px){.wrap{margin:0;border:0;border-radius:0;min-height:100vh}.form{padding:22px 15px}}</style></head>
<body><div class="wrap"><header class="head"><b>CP LOCKER</b><div>Digital Document Locker</div></header><main class="form"><form id="loginForm"><div class="field"><label for="email">Email</label><input id="email" required type="email" autocomplete="email"></div><div class="field"><label for="password">Password</label><input id="password" required type="password" autocomplete="current-password"></div><button class="btn" id="loginBtn" type="submit">Login Securely</button><div class="msg" id="message" hidden></div></form><div class="links"><a href="document-locker-register.html">Create Account</a> · <a href="document-locker.html">Locker Home</a></div></main></div>
<script>
const SUPABASE_URL='https://nnwbezwnwxybwwnhaetw.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_4Bc8uilYx3TZZ91EBy0z-g_ZxFQ2e2Q';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const form=document.getElementById('loginForm'),msg=document.getElementById('message'),btn=document.getElementById('loginBtn');
function show(text,ok=false){msg.hidden=false;msg.textContent=text;msg.style.color=ok?'#087c18':'#a00000'}
form.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;show('Signing in…',true);try{const {data,error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;if(!data.session)throw new Error('No authenticated session was created.');location.replace('document-locker-dashboard.html')}catch(err){show(err.message||'Login failed. Please check your credentials and email verification status.')}finally{btn.disabled=false}});
</script></body></html>
